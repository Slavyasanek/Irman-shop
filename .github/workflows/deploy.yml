name: Deploy Theme to cPanel LIVE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Theme via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            PROJECT_DIR="/home2/irmansho/public_html/wp-content/themes/irman_v2/"
            REPO_URL="ssh://git@ssh.github.com:443/Slavyasanek/Irman-shop.git"
            BRANCH="main"

            git config --global --add safe.directory $PROJECT_DIR

            cd $PROJECT_DIR

            if [ ! -d .git ]; then
              echo "📦 .git folder not found. Initializing Git..."
              git init
              git remote add origin $REPO_URL
              git fetch origin $BRANCH
              git checkout -f $BRANCH
              git branch --set-upstream-to=origin/$BRANCH $BRANCH
            else
              echo "🔄 .git folder exists. Ensuring correct remote URL..."
              git remote set-url origin $REPO_URL || git remote add origin $REPO_URL
              
              # Fetch latest history from new GitHub repo
              git fetch origin $BRANCH
              
              # FORCE server files to match main
              git reset --hard origin/$BRANCH
              git clean -fd
            fi

            echo "✅ Theme deployed successfully to irman_v2!"