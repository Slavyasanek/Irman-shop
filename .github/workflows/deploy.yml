name: Deploy Theme to cPanel LIVE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Theme via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Exit script immediately on any command failure
            set -e

            PROJECT_DIR="/home2/irmansho/public_html/wp-content/themes/irman_v2/"
            # SSH over port 443 to bypass cPanel outbound port 22 firewall blocking
            REPO_URL="ssh://git@ssh.github.com:443/Slavyasanek/Irman-shop.git"
            BRANCH="main"

            mkdir -p $PROJECT_DIR
            git config --global --add safe.directory $PROJECT_DIR
            git config --global init.defaultBranch main

            cd $PROJECT_DIR

            if [ ! -d .git ]; then
              echo "📦 Initializing Git in theme directory..."
              git init
              git remote add origin $REPO_URL
              git fetch origin $BRANCH
              git checkout -f $BRANCH
              git branch --set-upstream-to=origin/$BRANCH $BRANCH
            else
              echo "🔄 Fetching latest theme updates..."
              git remote set-url origin $REPO_URL
              git fetch origin $BRANCH
              git reset --hard origin/$BRANCH
              git clean -fd
            fi

            echo "✅ Theme deployed successfully to irman_v2!"